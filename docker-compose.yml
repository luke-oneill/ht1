services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: healthtech
      POSTGRES_USER: healthtech
      POSTGRES_PASSWORD: healthtech
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthtech -d healthtech"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - healthtech_postgres_data:/var/lib/postgresql/data

volumes:
  healthtech_postgres_data:
