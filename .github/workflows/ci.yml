name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: healthtech
          POSTGRES_USER: healthtech
          POSTGRES_PASSWORD: healthtech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healthtech -d healthtech"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: healthtech
      DB_PASSWORD: healthtech
      DB_NAME: healthtech

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Run integration tests
        run: npm run test:integration

      - name: Check whitespace
        run: git diff --check
